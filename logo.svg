<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <!-- Top Horizontal Bar -->
  <rect x="95" y="24" width="375" height="10" rx="5" fill="#91D2E6"/>

  <!-- Orange dot on 'i' -->
  <circle cx="163" cy="38" r="14" fill="#F47A20"/>

  <!-- Main Vinayak Typography -->
  <text x="5" y="132" 
        font-family="'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" 
        font-weight="900" 
        font-size="118" 
        fill="#91D2E6" 
        letter-spacing="-1.5">
    vinayak
  </text>

  <!-- Registered Trademark Sign (R) -->
  <g transform="translate(482, 38)">
    <circle cx="12" cy="12" r="11" fill="none" stroke="#91D2E6" stroke-width="2.5"/>
    <text x="12" y="16.5" 
          font-family="'Arial', sans-serif" 
          font-weight="bold" 
          font-size="12" 
          text-anchor="middle" 
          fill="#91D2E6">R</text>
  </g>

  <!-- Subtitle: SINCE 1981 -->
  <text x="500" y="185" 
        font-family="'Arial Black', 'Montserrat', sans-serif" 
        font-weight="900" 
        font-size="25" 
        text-anchor="end" 
        fill="#91D2E6" 
        letter-spacing="2">
    SINCE 1981
  </text>
</svg>
